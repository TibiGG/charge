# Charge backend on the Oracle VM: Caddy (TLS) -> API + PocketBase.
# Values come from /opt/charge/infra/oracle/.env (made by deploy.sh; never committed).
# This Caddy also fronts the dev stack (docker-compose.dev.yml, from the `dev` branch) over the
# shared `charge-edge` network: `docker network create charge-edge` once, before the first `up`.
services:
  pocketbase:
    build: ../../pocketbase
    restart: unless-stopped
    volumes:
      - pb_data:/pb/pb_data

  api:
    build: ../../backend
    restart: unless-stopped
    environment:
      PORT: "8080"
      PB_URL: http://pocketbase:8090
      PB_ADMIN_EMAIL: ${PB_ADMIN_EMAIL}
      PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD}
      CHARGE_DEMO_WRITES: "0"
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    depends_on:
      - pocketbase

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_HOST: ${API_HOST}
      PB_HOST: ${PB_HOST}
      API_DEV_HOST: ${API_DEV_HOST:-api-dev.localhost}
      PB_DEV_HOST: ${PB_DEV_HOST:-pb-dev.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    networks:
      - default
      - edge
    depends_on:
      - api
      - pocketbase

networks:
  edge:
    external: true
    name: charge-edge

volumes:
  pb_data:
  caddy_data:
