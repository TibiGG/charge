# Test every push and pull request; deploy pushes to main (live) and dev (testing).
#   main -> /opt/charge on the Oracle VM (api.<host>, pb.<host>) and charge-health.vercel.app
#   dev  -> /opt/charge-dev on the same VM (api-dev.<host>, pb-dev.<host>, its own accounts and data)
#           and charge-health-dev.vercel.app
#   API: copy backend/, pocketbase/, infra/ to the VM and rebuild the containers.
#        The VM keeps each stack's .env (PocketBase superuser login); CI never sees it.
#   Web: deploy frontend/ to Vercel (each project's env vars, i.e. which API it uses, live in Vercel).
# Each deploy job skips itself, with a note, until its secrets are set (see README, "Continuous deployment").
name: Test and deploy

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PB_VERSION: "0.40.4"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: PocketBase, for the signed-in tests
        run: |
          curl -fsSL -o /tmp/pb.zip "https://github.com/pocketbase/pocketbase/releases/download/v${PB_VERSION}/pocketbase_${PB_VERSION}_linux_amd64.zip"
          unzip -q /tmp/pb.zip -d /tmp/pb
          echo "PB_BIN=/tmp/pb/pocketbase" >> "$GITHUB_ENV"
      - run: python -m pytest -q tests
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npx svelte-kit sync
          npx svelte-check --threshold error

  deploy-api:
    needs: test
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'dev')
    runs-on: ubuntu-latest
    concurrency: deploy-api-${{ github.ref_name }}
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
      SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      API_URL: ${{ secrets.API_URL }}
      DIR: ${{ github.ref_name == 'main' && '/opt/charge' || '/opt/charge-dev' }}
    steps:
      - id: ready
        run: |
          if [ -n "$HOST" ] && [ -n "$SSH_KEY" ] && [ -n "$KNOWN_HOSTS" ]; then echo "go=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::API deploy skipped: set DEPLOY_HOST, DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS."; fi
      - if: steps.ready.outputs.go
        uses: actions/checkout@v7
      - if: steps.ready.outputs.go
        name: SSH key (CI-only, pinned to this VM)
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          echo "SSH=ssh -i $HOME/.ssh/deploy -o StrictHostKeyChecking=yes ubuntu@$HOST" >> "$GITHUB_ENV"
      - if: steps.ready.outputs.go
        name: Copy code
        run: |
          $SSH "sudo install -d -o ubuntu -g ubuntu $DIR"
          rsync -az --delete -e "ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes" \
            --exclude __pycache__ --exclude .pytest_cache --exclude pb_data --exclude '.terraform*' \
            --exclude '*.tfstate*' --exclude terraform.tfvars --exclude plan.out --exclude .env \
            backend pocketbase infra "ubuntu@$HOST:$DIR/"
      - if: steps.ready.outputs.go && github.ref_name == 'main'
        name: Rebuild and restart (live)
        run: |
          $SSH 'set -e; cd /opt/charge/infra/oracle && test -f .env
            sudo docker network create charge-edge >/dev/null 2>&1 || true
            # Older .env files predate the dev stack: give Caddy its host names, next to the live ones.
            grep -q "^API_DEV_HOST=" .env || sed -n "s/^API_HOST=api\./API_DEV_HOST=api-dev./p" .env >> .env
            grep -q "^PB_DEV_HOST=" .env || sed -n "s/^PB_HOST=pb\./PB_DEV_HOST=pb-dev./p" .env >> .env
            sudo docker compose up -d --build --remove-orphans'
      - if: steps.ready.outputs.go && github.ref_name == 'dev'
        name: Rebuild and restart (dev)
        run: |
          $SSH 'set -e; cd /opt/charge-dev/infra/oracle
            sudo docker network create charge-edge >/dev/null 2>&1 || true
            if [ ! -f .env ]; then  # first deploy: a superuser login of its own, made and kept on the VM
              (umask 077; printf "PB_ADMIN_EMAIL=admin@charge-dev.local\nPB_ADMIN_PASSWORD=%s\n" "$(openssl rand -hex 24)" > .env)
            fi
            set -a; . ./.env; set +a
            sudo docker compose -f docker-compose.dev.yml up -d --build --remove-orphans
            sleep 3
            sudo docker compose -f docker-compose.dev.yml exec -T dev-pocketbase \
              /pb/pocketbase superuser upsert "$PB_ADMIN_EMAIL" "$PB_ADMIN_PASSWORD" --dir /pb/pb_data >/dev/null'
      - if: steps.ready.outputs.go && env.API_URL != ''
        name: Health check
        run: |
          url="$API_URL"; [ "$GITHUB_REF_NAME" = dev ] && url="${url/:\/\/api./://api-dev.}"
          for i in $(seq 1 30); do curl -fsS "$url/api/health" && exit 0; sleep 10; done
          echo "::error::$url did not come back healthy"; exit 1
      - if: always()
        run: rm -f ~/.ssh/deploy

  deploy-web:
    needs: test
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'dev')
    runs-on: ubuntu-latest
    concurrency: deploy-web-${{ github.ref_name }}
    env:
      # One team-wide token does both. Optionally, VERCEL_DEV_TOKEN (a token limited to charge-health-dev)
      # is used for dev instead, and VERCEL_TOKEN can then be limited to charge-health.
      VERCEL_TOKEN: ${{ github.ref_name == 'dev' && secrets.VERCEL_DEV_TOKEN || secrets.VERCEL_TOKEN }}
      # Not secret: the team "tibigg's projects", and charge-health (main) or charge-health-dev (dev).
      VERCEL_ORG_ID: team_6xXVIFQZ74qnbRcdqlPeYEFG
      VERCEL_PROJECT_ID: ${{ github.ref_name == 'main' && 'prj_C9N5eaNPtdhDdWAwCe6nDfA0vGeV' || 'prj_5BbcfNaRswLQMVIKUcQ9EsKXbU4w' }}
    steps:
      - id: ready
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then echo "go=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Web deploy skipped: set VERCEL_TOKEN."; fi
      - if: steps.ready.outputs.go
        uses: actions/checkout@v7
      - if: steps.ready.outputs.go
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - if: steps.ready.outputs.go
        working-directory: frontend
        run: npx -y vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
