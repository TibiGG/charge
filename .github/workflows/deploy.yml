# Test every push and pull request; deploy pushes to main.
#   API: copy backend/, pocketbase/, infra/ to the Oracle VM and rebuild the containers.
#        The VM keeps its own .env (PocketBase superuser login); CI never sees it.
#   Web: deploy frontend/ to Vercel (the project's env vars live in Vercel).
# Each deploy job skips itself, with a note, until its secrets are set (see README, "Continuous deployment").
name: Test and deploy

on:
  push:
    branches: [main, production]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PB_VERSION: "0.40.4"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: PocketBase, for the signed-in tests
        run: |
          curl -fsSL -o /tmp/pb.zip "https://github.com/pocketbase/pocketbase/releases/download/v${PB_VERSION}/pocketbase_${PB_VERSION}_linux_amd64.zip"
          unzip -q /tmp/pb.zip -d /tmp/pb
          echo "PB_BIN=/tmp/pb/pocketbase" >> "$GITHUB_ENV"
      - run: python -m pytest -q tests
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npx svelte-kit sync
          npx svelte-check --threshold error

  deploy-api:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-api
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
      SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      API_URL: ${{ secrets.API_URL }}
    steps:
      - id: ready
        run: |
          if [ -n "$HOST" ] && [ -n "$SSH_KEY" ] && [ -n "$KNOWN_HOSTS" ]; then echo "go=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::API deploy skipped: set DEPLOY_HOST, DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS."; fi
      - if: steps.ready.outputs.go
        uses: actions/checkout@v7
      - if: steps.ready.outputs.go
        name: SSH key (CI-only, pinned to this VM)
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - if: steps.ready.outputs.go
        name: Copy code
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes" \
            --exclude __pycache__ --exclude .pytest_cache --exclude pb_data --exclude '.terraform*' \
            --exclude '*.tfstate*' --exclude terraform.tfvars --exclude plan.out --exclude .env \
            backend pocketbase infra "ubuntu@$HOST:/opt/charge/"
      - if: steps.ready.outputs.go
        name: Rebuild and restart
        run: |
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes "ubuntu@$HOST" \
            'cd /opt/charge/infra/oracle && test -f .env && sudo docker compose up -d --build --remove-orphans'
      - if: steps.ready.outputs.go && env.API_URL != ''
        name: Health check
        run: |
          for i in $(seq 1 30); do curl -fsS "$API_URL/api/health" && exit 0; sleep 10; done
          echo "::error::API did not come back healthy"; exit 1
      - if: always()
        run: rm -f ~/.ssh/deploy

  deploy-web:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-web
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - id: ready
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then echo "go=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Web deploy skipped: set VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID."; fi
      - if: steps.ready.outputs.go
        uses: actions/checkout@v7
      - if: steps.ready.outputs.go
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - if: steps.ready.outputs.go
        working-directory: frontend
        run: npx -y vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
